# MyCalendar - XcodeGen 프로젝트 설정
#
# Mac이 없으므로 .xcodeproj를 직접 만들지 않고, GitHub Actions(macOS)에서
# `xcodegen generate` 로 이 파일에서 MyCalendar.xcodeproj를 생성한다.
# .xcodeproj와 Config/*-Info.plist는 생성물이므로 Git에 올리지 않는다.
name: MyCalendar

options:
  developmentLanguage: ko
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # 번들 ID 접두어. 서명 단계에서 바꿔야 하면 이 값만 수정한다.
    # (CI에서 `xcodebuild BUNDLE_ID_PREFIX=...` 로 덮어쓸 수도 있다)
    BUNDLE_ID_PREFIX: com.cjfghksals
    # 앱과 위젯이 데이터를 공유하는 App Group ID.
    # Config/*.entitlements 와 Info.plist의 AppGroupIdentifier 가 이 값을 참조한다.
    APP_GROUP_ID: group.$(BUNDLE_ID_PREFIX).mycalendar
    # Google OAuth iOS 클라이언트 ID. 소스에는 넣지 않고,
    # CI가 GitHub Secret(GOOGLE_IOS_CLIENT_ID)으로 xcodebuild에 넘겨 덮어쓴다.
    GOOGLE_IOS_CLIENT_ID: ""
    GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.not-configured

# 외부 라이브러리: Google OAuth 로그인 (OpenID Foundation AppAuth, 의존 패키지 없음)
packages:
  AppAuth:
    url: https://github.com/openid/AppAuth-iOS
    from: 3.0.0

# 모든 타깃에 공통으로 적용하는 설정
# (XcodeGen iOS 프리셋이 타깃 수준에서 iPhone+iPad로 설정하므로 타깃마다 덮어쓴다)
settingGroups:
  common:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MyCalendar:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    dependencies:
      - target: MyCalendarWidget
      - package: AppAuth
    info:
      path: Config/MyCalendar-Info.plist
      properties:
        CFBundleDisplayName: MyCalendar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_ID)
        GoogleClientID: $(GOOGLE_IOS_CLIENT_ID)
        # Google 로그인 후 앱으로 돌아오는 주소 (역순 클라이언트 ID)
        CFBundleURLTypes:
          - CFBundleURLName: GoogleOAuth
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      groups:
        - common
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).mycalendar
        CODE_SIGN_ENTITLEMENTS: Config/MyCalendar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  MyCalendarWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: MyCalendar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      groups:
        - common
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).mycalendar.widget
        CODE_SIGN_ENTITLEMENTS: Config/Widget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  MyCalendarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MyCalendarTests
    dependencies:
      - target: MyCalendar
      # 앱 모듈이 AppAuth(Objective-C)를 쓰므로 테스트 컴파일에도 모듈이 필요하다.
      - package: AppAuth
    settings:
      groups:
        - common
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).mycalendar.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MyCalendar:
    build:
      targets:
        MyCalendar: all
        MyCalendarTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MyCalendarTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
